site_name: Park & Ride Audit
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - content.action.view
markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Methodology:
      - Data Collection: methodology/data-collection.md
  - Tables:
      - Summary Table: tables/summary-table.md
